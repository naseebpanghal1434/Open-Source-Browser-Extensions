<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Quick Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">Quick Notes</div>
      <div class="controls">
        <button id="settingsBtn" title="Settings">⚙️</button>
        <button id="floatBtn" title="Open floating note">📝</button>
        <button id="expandBtn" title="Open expanded note">⬜</button>
        <div id="saveStatus" class="save-status">Saved</div>
      </div>
    </div>

    <!-- Tab Navigation -->
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="tasks">Tasks</button>
      <button class="tab-btn" data-tab="notes">Notes</button>
    </div>

    <!-- Tasks Tab Content -->
    <div id="tasksTab" class="tab-content active">
      <div class="task-section">
        <div class="section-header">
          <span class="section-title">MITs (Most Important Tasks)</span>
          <button class="add-task-btn" data-section="mits">+</button>
        </div>
        <div id="mitsContainer" class="task-list"></div>
      </div>

      <div class="task-section">
        <div class="section-header">
          <span class="section-title">Tasks (Today)</span>
          <button class="add-task-btn" data-section="today">+</button>
        </div>
        <div id="todayContainer" class="task-list"></div>
      </div>

      <div class="task-section">
        <div class="section-header">
          <span class="section-title">EOD Notes</span>
        </div>
        <textarea id="eodEditor" class="eod-editor" placeholder="End of day notes..."></textarea>
      </div>
    </div>

    <!-- Notes Tab Content -->
    <div id="notesTab" class="tab-content">
      <div class="editor-container">
        <textarea id="noteEditor" placeholder="Start typing your note here..."></textarea>
      </div>

      <div class="note-controls">
        <button id="clearBtn" title="Clear note">🗑️ Clear</button>
      </div>

      <div class="footer">
        <div class="stats">
          <span id="charCount">0 characters</span>
          <span id="wordCount">0 words</span>
        </div>
        <div id="lastModified" class="timestamp">Last modified: Never</div>
      </div>
    </div>

    <button id="manageBtn" title="Manage notes & settings">⚙️ Manage Notes</button>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Settings</h3>
        <button class="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="setting-item">
          <label for="defaultTab">Default Tab:</label>
          <select id="defaultTab">
            <option value="tasks">Tasks</option>
            <option value="notes">Notes</option>
          </select>
        </div>
        <div class="setting-item">
          <label for="perDomainSetting">Storage Mode:</label>
          <select id="perDomainSetting">
            <option value="true">Per Domain</option>
            <option value="false">Per URL</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button id="saveSettings" class="primary-btn">Save</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
